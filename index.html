<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的待辦清單</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --bg: #f4f5f7;
      --surface: #ffffff;
      --surface-alt: #f4f5f7;
      --text: #1f2328;
      --text-muted: #656d76;
      --border: #d0d7de;
      --accent: #1f883d;
      --accent-hover: #1a7f37;
      --danger: #cf222e;
      --danger-soft: rgba(207, 34, 46, 0.1);
      --shadow: rgba(0, 0, 0, 0.08);
    }

    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0d1117;
        --surface: #161b22;
        --surface-alt: #0d1117;
        --text: #e6edf3;
        --text-muted: #8b949e;
        --border: #30363d;
        --accent: #238636;
        --accent-hover: #2ea043;
        --danger: #f85149;
        --danger-soft: rgba(248, 81, 73, 0.15);
        --shadow: rgba(0, 0, 0, 0.4);
      }
    }

    :root[data-theme="dark"] {
      --bg: #0d1117;
      --surface: #161b22;
      --surface-alt: #0d1117;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --border: #30363d;
      --accent: #238636;
      --accent-hover: #2ea043;
      --danger: #f85149;
      --danger-soft: rgba(248, 81, 73, 0.15);
      --shadow: rgba(0, 0, 0, 0.4);
    }

    body {
      margin: 0;
      padding: 24px 16px;
      min-height: 100vh;
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .app {
      width: 100%;
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px var(--shadow);
    }

    .app-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0;
      font-size: 1.4rem;
    }

    .btn-theme {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      padding: 6px 12px;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 999px;
      cursor: pointer;
    }

    .btn-theme:hover {
      border-color: var(--accent);
    }

    .todo-form {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font-size: 1rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .todo-input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .btn-add {
      padding: 10px 18px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .filters {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .btn-filter {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.9rem;
      color: var(--text-muted);
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-filter:hover {
      color: var(--text);
    }

    .btn-filter.is-active {
      color: #fff;
      background: var(--accent);
      border-color: var(--accent);
    }

    .todo-list {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .todo-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    .todo-text {
      flex: 1;
      min-width: 0;
      word-break: break-word;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .btn-delete {
      flex-shrink: 0;
      padding: 4px 8px;
      font-size: 1rem;
      line-height: 1;
      color: var(--danger);
      background: transparent;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-delete:hover {
      background: var(--danger-soft);
    }

    .empty-state {
      margin: 16px 0 0;
      text-align: center;
      color: var(--text-muted);
    }

    .app-footer {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    @media (max-width: 420px) {
      .app {
        padding: 16px;
      }

      .app-header {
        flex-direction: column;
        align-items: stretch;
      }

      .todo-form {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>📝 我的待辦清單</h1>
      <!-- 深色模式切換 -->
      <button id="theme-toggle" type="button" class="btn-theme" aria-pressed="false">
        <span id="theme-icon">🌙</span>
        <span id="theme-label">深色模式</span>
      </button>
    </header>

    <!-- 新增待辦的表單 -->
    <form id="todo-form" class="todo-form" autocomplete="off">
      <label class="sr-only" for="todo-input">待辦事項內容</label>
      <input
        id="todo-input"
        class="todo-input"
        type="text"
        placeholder="今天要做什麼?"
        maxlength="100"
        required
      >
      <button type="submit" class="btn-add">新增</button>
    </form>

    <!-- 篩選:全部 / 未完成 / 已完成 -->
    <div class="filters" role="group" aria-label="篩選待辦事項">
      <button type="button" class="btn-filter is-active" data-filter="all" aria-pressed="true">全部</button>
      <button type="button" class="btn-filter" data-filter="active" aria-pressed="false">未完成</button>
      <button type="button" class="btn-filter" data-filter="completed" aria-pressed="false">已完成</button>
    </div>

    <!-- 待辦清單本體,內容由 JavaScript 動態產生 -->
    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <!-- 清單為空時顯示的提示 -->
    <p id="empty-state" class="empty-state" hidden>還沒有任何待辦事項,新增一個吧!</p>

    <footer class="app-footer">
      <span id="remaining-count">未完成:0 項</span>
    </footer>
  </main>

  <script>
    const form = document.getElementById('todo-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const emptyState = document.getElementById('empty-state');
    const remainingCount = document.getElementById('remaining-count');
    const filterButtons = document.querySelectorAll('.btn-filter');
    const themeToggle = document.getElementById('theme-toggle');
    const themeIcon = document.getElementById('theme-icon');
    const themeLabel = document.getElementById('theme-label');

    let todos = [];
    let currentFilter = 'all';

    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;

      const isDark = theme === 'dark';
      themeIcon.textContent = isDark ? '☀️' : '🌙';
      themeLabel.textContent = isDark ? '淺色模式' : '深色模式';
      themeToggle.setAttribute('aria-pressed', String(isDark));
    }

    function initTheme() {
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(prefersDark ? 'dark' : 'light');
    }

    function getVisibleTodos() {
      if (currentFilter === 'active') {
        return todos.filter((todo) => !todo.completed);
      }
      if (currentFilter === 'completed') {
        return todos.filter((todo) => todo.completed);
      }
      return todos;
    }

    function getEmptyMessage() {
      if (todos.length === 0) {
        return '還沒有任何待辦事項,新增一個吧!';
      }
      if (currentFilter === 'active') {
        return '太棒了,沒有未完成的事項!';
      }
      if (currentFilter === 'completed') {
        return '還沒有已完成的事項。';
      }
      return '沒有符合條件的待辦事項。';
    }

    function render() {
      const visibleTodos = getVisibleTodos();
      list.replaceChildren();

      visibleTodos.forEach((todo) => {
        const item = document.createElement('li');
        item.className = todo.completed ? 'todo-item completed' : 'todo-item';
        item.dataset.id = todo.id;

        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.checked = todo.completed;
        checkbox.setAttribute('aria-label', `標記「${todo.text}」為完成`);

        const text = document.createElement('span');
        text.className = 'todo-text';
        text.textContent = todo.text;

        const deleteButton = document.createElement('button');
        deleteButton.type = 'button';
        deleteButton.className = 'btn-delete';
        deleteButton.textContent = '✕';
        deleteButton.setAttribute('aria-label', `刪除「${todo.text}」`);

        item.append(checkbox, text, deleteButton);
        list.append(item);
      });

      emptyState.hidden = visibleTodos.length > 0;
      emptyState.textContent = getEmptyMessage();

      const remaining = todos.filter((todo) => !todo.completed).length;
      remainingCount.textContent = `未完成:${remaining} 項`;
    }

    function createId() {
      return `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
    }

    function addTodo(text) {
      todos.push({
        id: createId(),
        text,
        completed: false,
      });
      render();
    }

    function toggleTodo(id) {
      todos = todos.map((todo) =>
        todo.id === id ? { ...todo, completed: !todo.completed } : todo
      );
      render();
    }

    function deleteTodo(id) {
      todos = todos.filter((todo) => todo.id !== id);
      render();
    }

    function setFilter(filter) {
      currentFilter = filter;

      filterButtons.forEach((button) => {
        const isActive = button.dataset.filter === filter;
        button.classList.toggle('is-active', isActive);
        button.setAttribute('aria-pressed', String(isActive));
      });

      render();
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const text = input.value.trim();
      if (!text) return;

      addTodo(text);
      input.value = '';
      input.focus();
    });

    list.addEventListener('click', (event) => {
      const item = event.target.closest('.todo-item');
      if (!item) return;

      const id = item.dataset.id;

      if (event.target.matches('input[type="checkbox"]')) {
        toggleTodo(id);
      } else if (event.target.matches('.btn-delete')) {
        deleteTodo(id);
      }
    });

    filterButtons.forEach((button) => {
      button.addEventListener('click', () => setFilter(button.dataset.filter));
    });

    themeToggle.addEventListener('click', () => {
      const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(nextTheme);
    });

    initTheme();
    render();
  </script>
</body>
</html>
